name: Release

on:
  push:
    tags:
      - "v*"
  # Fallback for the case where a tag is created via the GitHub API (e.g.
  # `gh release create vX.Y.Z`) instead of `git push`. API-created tags do
  # NOT fire the `push: tags:` event, which is how v0.32.3 ended up with a
  # release record but no auto-built artifacts. Operators can re-run the
  # matrix by hand against the tag if auto-fire is skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build/release (e.g. v0.32.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-macos
            artifact: labelle-assembler-macos-aarch64
            os: macos-latest
          - target: x86_64-macos
            artifact: labelle-assembler-macos-x86_64
            os: macos-latest
          - target: aarch64-linux
            artifact: labelle-assembler-linux-aarch64
            os: ubuntu-latest
          - target: x86_64-linux
            artifact: labelle-assembler-linux-x86_64
            os: ubuntu-latest
          - target: x86_64-windows
            artifact: labelle-assembler-windows-x86_64
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    # Bound the per-platform release build so a wedged runner can't stall
    # a release for hours. Cross-compiling the assembler binary is a few
    # minutes; 20 covers any platform without risking a hang.
    timeout-minutes: 20

    # build.zig.zon has a `.path = "../labelle-gui/flow-codegen"` dep, so the
    # gui sibling has to live next to the assembler checkout. actions/checkout
    # forbids `path:` values that escape the workspace, so both checkouts go
    # into named subdirs and the build runs from inside the assembler one.
    defaults:
      run:
        working-directory: labelle-assembler

    steps:
      - uses: actions/checkout@v4
        with:
          path: labelle-assembler
          # On `workflow_dispatch` the default ref is the workflow's branch,
          # not the tag we want to release; pin it to the input tag so the
          # build matches the release artifact name.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Checkout labelle-gui (flow_codegen)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          # Track gui's main; the 0.16-migrated flow-codegen lives there.
          ref: main
          path: labelle-gui

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        env:
          # On `push: tags:` GITHUB_REF_NAME is the tag; on workflow_dispatch
          # it's the workflow's branch, so fall back to the dispatch input.
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          # Stamp ONLY the assembler's own version (the tag). The cli/core/
          # engine/gfx scaffold defaults come from build.zig's curated set —
          # stamping the assembler tag into them scaffolded projects pinned to
          # nonsense versions like `core_version = "0.91.0"` (labelle-cli#322).
          zig build \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=ReleaseSafe \
            -Dassembler_version="$VERSION"

      - name: Rename binary
        # Windows targets produce `labelle-assembler.exe`; every other target
        # produces `labelle-assembler`. The published asset name omits the
        # `.exe` suffix on all platforms so the CLI's download-URL builder
        # (`labelle-assembler-<os>-<arch>`, no extension) matches exactly.
        run: |
          if [ -f zig-out/bin/labelle-assembler.exe ]; then
            cp zig-out/bin/labelle-assembler.exe ${{ matrix.artifact }}
          else
            cp zig-out/bin/labelle-assembler ${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # `working-directory: labelle-assembler` only affects `run:` steps,
          # so the `uses:` action needs the explicit relative path.
          path: labelle-assembler/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    # Just downloads the built artifacts and creates the GitHub release —
    # seconds of work; 10 is plenty and bounds a stuck runner.
    timeout-minutes: 10

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # HTTPS + a tag pin authenticate the *host*, not the asset bytes, and
      # GitHub release assets are mutable: an asset can be deleted and
      # re-uploaded under the same name on an existing tag. Publishing a
      # SHA256SUMS manifest alongside the binaries gives consumers something
      # to verify a `curl`ed binary against before they `chmod +x` and run it.
      # (Same-release manifest, so this hardens against asset replacement, not
      # against a full repo compromise — that needs signing, e.g. minisign or
      # cosign, which can layer on top later.)
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          # `merge-multiple: true` above flattens every matrix artifact into
          # artifacts/, so the five binaries sit here as bare files.
          #
          # Checksum them by BARE FILENAME (cd into artifacts/, glob only the
          # binaries) so the manifest reads:
          #
          #   <sha256>  labelle-assembler-linux-x86_64
          #
          # That is the plain coreutils/`shasum` format, which means a consumer
          # that downloaded ONE binary into its cwd can verify with no path
          # rewriting:
          #
          #   grep ' labelle-assembler-linux-x86_64$' SHA256SUMS | shasum -a 256 -c -
          #
          # A manifest keyed on paths (artifacts/..., or absolute) would force
          # every consumer to sed the prefix off first. The glob is
          # `labelle-assembler-*` rather than `*` so the manifest never tries
          # to checksum itself.
          shasum -a 256 labelle-assembler-* > SHA256SUMS
          cat SHA256SUMS

          # Guard the published contract, so a broken manifest fails the
          # release run instead of shipping:
          #
          # 1. Exactly the five binaries, no more, no fewer — a matrix leg
          #    that silently stopped producing an artifact must not yield a
          #    quietly short manifest.
          test "$(wc -l < SHA256SUMS)" -eq 5
          # 2. Every line is `<64 hex>  <bare filename>` — TEXT mode, two
          #    spaces. `shasum` picks its default mode from the platform and
          #    emits ` *name` (binary mode) on Windows hosts; on the
          #    ubuntu-latest runner it is text mode. Assert it rather than
          #    trust it, because the two-space form is what the documented
          #    consumer `grep` above matches.
          if grep -qvE '^[0-9a-f]{64}  labelle-assembler-[a-z0-9_]+-[a-z0-9_]+$' SHA256SUMS; then
            echo "::error::SHA256SUMS is not in plain two-space text format"
            exit 1
          fi
          # 3. It is a file plain `shasum -c` / `sha256sum -c` accepts.
          shasum -a 256 -c SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Six assets now: the five per-platform binaries plus the
          # SHA256SUMS manifest the step above wrote into artifacts/.
          files: artifacts/*
          # On `push: tags:` this is implicit; on workflow_dispatch we must
          # pass the tag so assets land on the correct release.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}

  # Publish the same binaries to the shared R2 bucket, mirroring labelle-cli's
  # `upload-r2` job (objects at assembler/<tag>/<asset>, latest tag in
  # assembler/latest.txt). labelle-studio's fetch-sidecars sources the
  # assembler from here; the GitHub release above stays as its fallback.
  # Runs alongside `release` (both only need `build`), so a broken R2 upload
  # never blocks the GitHub release, and vice versa.
  upload-r2:
    needs: build
    runs-on: ubuntu-latest
    name: Upload to R2
    # Just downloads the built artifacts and copies them to R2 — seconds of
    # work; 10 is plenty and bounds a stuck runner.
    timeout-minutes: 10

    env:
      # R2_ACCOUNT_ID + R2_BUCKET are already provisioned as repo secrets; the
      # endpoint is the account's S3 API host (same shape labelle-cli uses).
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to R2
        env:
          # The R2 API token doubles as the AWS creds the CLI reads; also
          # expose the raw R2_* names so the gate below can probe them
          # (secrets are not readable in job/step `if:` expressions).
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # R2's S3 API needs a region; "auto" is Cloudflare's documented value.
          # The preinstalled aws CLI v2 (>=2.23) also sends integrity checksums
          # R2 rejects, so downgrade calculation/validation to when_required
          # (same compat settings labelle-studio's R2 upload uses).
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # On `push: tags:` github.ref_name is the tag; on workflow_dispatch
          # it's the workflow branch, so fall back to the dispatch input. Kept
          # with the leading `v` so the R2 tag path + latest.txt match what
          # studio's fetch-sidecars reads back (it uses the value verbatim).
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Gate the whole upload on the credential secrets being present so a
          # release run stays green before the R2 API token is added. The
          # endpoint is built from R2_ACCOUNT_ID (job env), so it's gated too:
          # if it were unset the endpoint would be a malformed
          # `https://.r2.cloudflarestorage.com` and the job would FAIL instead
          # of taking the intended green-skip. Once the R2 API token lands and
          # the next tag is cut, this lights up and studio starts sourcing the
          # assembler from R2 (its GitHub-release fallback goes dormant).
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && \
             [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ]; then
            VERSION="$RELEASE_TAG"

            # download-artifact (no merge-multiple) lays each matrix artifact
            # out as artifacts/<name>/<name>; publish it verbatim so the R2 key
            # is labelle-assembler-<os>-<arch> — byte-for-byte what studio's
            # fetch-sidecars requests (assembler/<tag>/labelle-assembler-<os>-<arch>).
            # aws is preinstalled on ubuntu-latest; no `pip install awscli`
            # (that breaks under Ubuntu 24.04's PEP 668 externally-managed env).
            for dir in artifacts/*/; do
              name=$(basename "$dir")
              for file in "$dir"*; do
                aws s3 cp "$file" "s3://$R2_BUCKET/assembler/$VERSION/$name" \
                  --endpoint-url "$R2_ENDPOINT"
              done
            done

            # Only advance the latest.txt pointer on a real tag push. A
            # workflow_dispatch run can rebuild an OLDER tag; overwriting
            # latest.txt there would downgrade studio consumers that follow it.
            # Re-uploading a prior version's per-tag objects (above) is harmless.
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "$VERSION" | aws s3 cp - "s3://$R2_BUCKET/assembler/latest.txt" \
                --endpoint-url "$R2_ENDPOINT"
              echo "Released $VERSION to R2 (advanced assembler/latest.txt)"
            else
              echo "::notice::Backfilled $VERSION artifacts to R2 via $GITHUB_EVENT_NAME; left assembler/latest.txt unchanged so consumers aren't downgraded."
            fi
          else
            echo "::notice::R2 creds absent — skipping upload (add R2_ACCESS_KEY_ID + R2_SECRET_ACCESS_KEY; R2_ACCOUNT_ID + R2_BUCKET are already set)"
          fi
